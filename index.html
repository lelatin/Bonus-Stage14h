<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>l'hebdo14h – l'actu jeu vidéo, sans le bruit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2716%27 fill=%27%23ffd60a%27/%3E%3Ctext x=%2750%27 y=%2766%27 font-size=%2750%27 font-weight=%27700%27 text-anchor=%27middle%27 font-family=%27Arial%27 fill=%27%23262626%27%3E14h%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap" rel="stylesheet">
<style>
:root{--y:#ffd60a;--g:#262626;--g2:#3b3b3b;--w:#fff;--r:8px;--o:#fe5000;--f:"Freckle Face",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--w);color:var(--g);font:400 16px/1.5 var(--f)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{padding:48px 0 30px;position:relative}
h1{display:inline-block;font:400 clamp(52px,11vw,120px)/.9 var(--f);letter-spacing:-.02em;color:var(--o);transform:rotate(-1.5deg)}
.sticker{position:absolute;right:8px;top:36px;padding:10px 16px;background:var(--o);color:var(--g);border-radius:var(--r);box-shadow:4px 4px 0 var(--g);font:400 17px/1.1 var(--f);transform:rotate(6deg);text-align:center}
.sticker b{display:block;font-size:34px;font-weight:900}
.bar{position:sticky;top:0;z-index:5;background:var(--w);padding:14px 0;border-bottom:3px solid var(--g)}
.search{display:flex;gap:10px}
input[type=search]{flex:1;min-width:0;font:400 17px var(--f);padding:13px 16px;border:3px solid var(--g);border-radius:var(--r);background:var(--w);color:var(--g);box-shadow:4px 4px 0 var(--g)}
input[type=search]::placeholder{color:#777}
input[type=search]:focus{outline:3px solid var(--y);outline-offset:2px}
button{font:400 16px var(--f);cursor:pointer;color:var(--g)}
.mix{padding:0 18px;border:3px solid var(--g);border-radius:var(--r);background:var(--o);color:var(--g);box-shadow:4px 4px 0 var(--g);transition:transform .12s,box-shadow .12s}
.mix:active,.chip:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--g)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:16px 4px 8px;scrollbar-width:none}
.chip{white-space:nowrap;padding:8px 16px;border:3px solid var(--g);border-radius:var(--r);background:var(--y);box-shadow:3px 3px 0 var(--g);transition:transform .12s,box-shadow .12s}
.chip:hover{transform:translate(-1px,-2px) rotate(-1.5deg)}
.chip[aria-pressed=true]{background:var(--g);color:var(--y)}
.sep{flex:none;width:3px;margin:4px 2px;border-radius:2px;background:var(--g)}
.chip.rub[aria-pressed=true]{background:var(--o);color:var(--g)}
.chip small{font-weight:500;font-style:normal;opacity:.7;margin-left:7px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:190px;grid-auto-flow:dense;gap:16px;padding:28px 0 24px}
.card{position:relative;display:flex;align-items:flex-end;grid-column:span 1;grid-row:span 1;border:3px solid var(--g);border-radius:var(--r);overflow:hidden;color:var(--w);text-decoration:none;background:var(--g2);box-shadow:5px 5px 0 var(--g);isolation:isolate;transition:transform .18s,box-shadow .18s}
.sz-l{grid-column:span 2;grid-row:span 2}.sz-w{grid-column:span 2}.sz-t{grid-row:span 2}
.card:hover,.card:focus-visible{transform:translate(-3px,-4px) rotate(-.8deg);box-shadow:9px 9px 0 var(--g)}
.card:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(38,38,38,.96) 0%,rgba(38,38,38,.6) 52%,transparent 88%)}
.in{padding:16px;width:100%}
.card h2{font:400 19px/1.08 var(--f);letter-spacing:-.01em;text-wrap:balance;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.sz-w h2,.sz-t h2{font-size:26px}.sz-l h2{font-size:clamp(28px,3.4vw,40px);-webkit-line-clamp:5}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.src,.card time{padding:2px 10px;border-radius:var(--r);font:400 12px/1.5 var(--f)}
.src{background:var(--o);color:var(--g)}
.card time{background:var(--w);color:var(--g)}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:26px;align-items:start}
.hebdo{position:sticky;top:var(--top,160px);margin-top:28px;padding:18px;background:var(--g);color:var(--w);border:3px solid var(--g);border-radius:var(--r);box-shadow:6px 6px 0 var(--o)}
.hb-name{font:400 clamp(40px,4.4vw,54px)/.95 var(--f);color:var(--o)}
.hb-by{margin:6px 0 16px;color:var(--y);font:400 18px var(--f)}
.hb-video{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:3px solid var(--w);border-radius:var(--r);overflow:hidden;background:#000;cursor:pointer}
.hb-video img{display:block;width:100%;height:100%;object-fit:cover}
.hb-play{position:absolute;inset:0;margin:auto;width:54px;height:54px;display:grid;place-items:center;border:3px solid var(--g);border-radius:50%;background:var(--y);color:var(--g);font-size:20px;transition:transform .15s}
.hb-video:hover .hb-play{transform:scale(1.12)}
iframe.hb-video{cursor:default}
.hb-empty{display:grid;place-items:center;text-decoration:none;background:repeating-linear-gradient(45deg,#333 0 12px,#3d3d3d 12px 24px)}
.hb-empty em{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:var(--y);font:400 15px var(--f)}
.hb-title{margin-top:14px;font:400 21px/1.15 var(--f)}
.hb-date{display:inline-block;margin-top:10px;padding:2px 10px;border-radius:var(--r);background:var(--y);color:var(--g);font:400 13px/1.5 var(--f)}
.hb-link{display:block;margin-top:16px;color:var(--y);font:400 16px var(--f)}
.hb-link:focus-visible,.hb-video:focus-visible{outline:3px solid var(--y);outline-offset:3px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.hebdo{position:static}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:170px}}
@media(max-width:520px){.grid{grid-template-columns:1fr;grid-auto-rows:210px}.sz-w,.sz-l{grid-column:span 1}}
.more{display:block;margin:10px auto 44px;padding:13px 28px;border:3px solid var(--g);border-radius:var(--r);background:var(--y);box-shadow:4px 4px 0 var(--g);font-size:17px}
.msg{grid-column:1/-1;padding:44px 8px;font:400 20px var(--f);text-align:center}
footer{padding:22px 0 48px;font-size:14px;border-top:3px solid var(--g)}
@media(max-width:620px){.sticker{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.card:hover,h1{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>l'hebdo14h</h1>
    <div class="sticker" id="sticker" hidden><b id="n">0</b>articles frais</div>
  </header>
</div>
<div class="bar" id="bar"><div class="wrap">
  <div class="search">
    <input id="q" type="search" placeholder="Cherche un jeu, un studio, une console…" aria-label="Rechercher un article">
    <button class="mix" id="mix" title="Changer l'ordre des articles">🎲 Mélanger</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filtrer par rubrique ou par site"></div>
</div></div>
<main class="wrap layout">
  <aside class="hebdo" id="hebdo" aria-label="Dernier épisode de L'HEBDO par Origami" hidden></aside>
  <div>
    <div class="grid" id="grid"><p class="msg">Chargement des articles…</p></div>
    <button class="more" id="more" hidden>Voir plus d'articles</button>
  </div>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
const PAGE = 24;
let ALL = [], SOURCES = {}, site = null, type = null, HEB = null, shown = PAGE;
const TYPES = ["Actu", "Tests", "Sorties"];
const $ = id => document.getElementById(id);

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function kind(a) {
  const t = norm(a.title + " " + (a.category || "")), u = a.link.toLowerCase();
  if (/\/(tests?|critiques?|reviews?)\//.test(u) || /\b(test|tests|critique|review|verdict|notre avis)\b/.test(t)) return "Tests";
  if (/date de sortie|sortie|sort le|sortira|disponible|disponibilite|lancement|debarque|arrive le|calendrier|release/.test(t)) return "Sorties";
  return "Actu";
}
const el = (t, props = {}, kids = []) => { const e = Object.assign(document.createElement(t), props); kids.forEach(k => e.append(k)); return e; };

function ago(iso) {
  const d = (Date.now() - new Date(iso)) / 36e5;
  if (isNaN(d)) return "";
  if (d < 1) return "il y a moins d'1 h";
  if (d < 24) return "il y a " + Math.floor(d) + " h";
  if (d < 48) return "hier";
  return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
}

function filtered() {
  const q = norm($("q").value.trim());
  return ALL.filter(a => (!type || a.type === type) && (!site || a.source === site) &&
    (!q || norm(a.title + " " + a.source).includes(q)));
}

function chip(label, count, on, fn) {
  const b = el("button", { className: "chip", type: "button" }, [label, el("small", { textContent: count })]);
  b.setAttribute("aria-pressed", on);
  b.onclick = () => { fn(); shown = PAGE; renderChips(); render(); };
  return b;
}
function renderChips() {
  const bySite = {}, byType = {};
  ALL.forEach(a => { bySite[a.source] = (bySite[a.source] || 0) + 1; byType[a.type] = (byType[a.type] || 0) + 1; });
  const t = TYPES.map(n => { const b = chip(n, byType[n] || 0, type === n, () => { type = type === n ? null : n; }); b.classList.add("rub"); return b; });
  const s = Object.keys(SOURCES).map(n => chip(n, bySite[n] || 0, site === n, () => { site = site === n ? null : n; }));
  $("chips").replaceChildren(chip("Tout", ALL.length, !type && !site, () => { type = site = null; }), ...t, el("span", { className: "sep" }), ...s);
}

const PATTERN = ["l","s","s","t","w","s","s","w","t","s","s","s"];
function card(a, i) {
  const c = el("a", { className: "card sz-" + PATTERN[i % PATTERN.length], href: a.link, target: "_blank", rel: "noopener" });
  if (a.image) { const m = el("img", { src: a.image, alt: "", loading: "lazy", referrerPolicy: "no-referrer" }); m.onerror = () => m.remove(); c.append(m); }
  c.append(el("div", { className: "in" }, [el("h2", { textContent: a.title }),
    el("div", { className: "meta" }, [el("span", { className: "src", textContent: a.source }), el("time", { textContent: ago(a.date) })])]));
  return c;
}

function render() {
  const list = filtered();
  const g = $("grid");
  if (!list.length) {
    g.replaceChildren(el("p", { className: "msg", textContent: ALL.length ? "Rien trouvé. Essaie un mot plus court ou change de rubrique." : "Rien à piocher pour l'instant ! Lance la mise à jour (voir le README) pour remplir la page." }));
  } else g.replaceChildren(...list.slice(0, shown).map(card));
  $("more").hidden = list.length <= shown;
}

function setTop() { document.documentElement.style.setProperty("--top", ($("bar").offsetHeight + 16) + "px"); }

const CHANNEL = "https://www.youtube.com/@Origatube/videos";
// Si la récupération automatique échoue, colle ici l'identifiant du dernier épisode (la fin du lien : youtube.com/watch?v=XXXXXXXXXXX).
const HEBDO_MANUAL_ID = "";

function renderHebdo(h) {
  if (!h && HEBDO_MANUAL_ID) h = { id: HEBDO_MANUAL_ID, title: "Le dernier épisode de L'HEBDO", date: "" };
  const kids = [el("p", { className: "hb-name", textContent: "L'HEBDO" }), el("p", { className: "hb-by", textContent: "par Origami" })];
  if (h) {
    const v = el("button", { className: "hb-video", type: "button", title: "Lire la vidéo" },
      [el("img", { src: "https://i.ytimg.com/vi/" + h.id + "/hqdefault.jpg", alt: "" }), el("span", { className: "hb-play", textContent: "▶" })]);
    v.onclick = () => v.replaceWith(el("iframe", { className: "hb-video", title: h.title, allowFullscreen: true,
      allow: "autoplay; encrypted-media; picture-in-picture", src: "https://www.youtube-nocookie.com/embed/" + h.id + "?autoplay=1&rel=0" }));
    kids.push(v, el("p", { className: "hb-title", textContent: h.title }), h.date ? el("span", { className: "hb-date", textContent: ago(h.date) }) : "");
  } else kids.push(el("a", { className: "hb-video hb-empty", href: CHANNEL, target: "_blank", rel: "noopener", title: "Voir la chaîne d'Origami" },
      [el("span", { className: "hb-play", textContent: "▶" }), el("em", { textContent: "Épisode à venir" })]),
    el("p", { className: "hb-title", textContent: "Le dernier épisode apparaîtra ici dès la prochaine mise à jour." }));
  kids.push(el("a", { className: "hb-link", href: CHANNEL, target: "_blank", rel: "noopener", textContent: "Toutes les vidéos" }));
  $("hebdo").replaceChildren(...kids);
  $("hebdo").hidden = false;
}

async function init() {
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    const d = await r.json();
    d.sources.forEach(s => SOURCES[s.name] = s);
    HEB = d.hebdo || null; ALL = shuffle(d.articles); ALL.forEach(a => a.type = kind(a));
    $("n").textContent = ALL.length; $("sticker").hidden = !ALL.length;
    $("foot").textContent = "Dernier tour de mise à jour : " + new Date(d.updated).toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" }) + ". Chaque carte renvoie vers l'article d'origine : les droits restent à leurs auteurs.";
  } catch (e) { ALL = []; }
  renderHebdo(HEB); renderChips(); render();
  setTop(); addEventListener("resize", setTop);
}
$("q").oninput = () => { shown = PAGE; render(); };
$("mix").onclick = () => { shuffle(ALL); shown = PAGE; render(); };
$("more").onclick = () => { shown += PAGE; render(); };
init();

</script>
</body>
</html>
