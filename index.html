<style>

<div class="bgfx" id="bgfx" aria-hidden="true"></div>
<div class="top">
  <div class="wrap nav">
    <h1>Bonus Stage14h</h1>
    <nav class="chips" id="chips" aria-label="Filtrer par chaîne"></nav>
    <div class="tools">
      <button class="ico" id="sb" type="button" aria-label="Rechercher" aria-expanded="false" aria-controls="sr"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="switch" id="theme" type="button" role="switch" aria-checked="false" aria-label="Mode sombre"><span class="knob" id="knob"></span></button>
    </div>
  </div>
  <div class="wrap srch" id="sr" hidden>
    <input id="q" type="search" placeholder="Cherche un jeu, une chaîne, un sujet…" aria-label="Rechercher une vidéo" autocomplete="off" enterkeyhint="search">
  </div>
</div>
<main class="wrap">
  <div class="grid" id="grid"><p class="msg">Chargement des articles…</p></div>
  <button class="more" id="more" hidden>Voir plus de vidéos</button>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
const PAGE = 16, TYPES = [];
let ALL = [], NEWS = [], SOURCES = {}, NSOURCES = {}, site = null, type = null, shown = PAGE;
const $ = id => document.getElementById(id);
const root = document.documentElement;

// Fonds : images du dossier FONDS, listées dans FONDS/index.json (ex. ["zelda.jpg","halo.webp"])
const FONDS = "fonds/";
async function backdrop() {
  let names = [];
  try { names = await (await fetch(FONDS + "index.json", { cache: "no-store" })).json(); } catch (e) {}
  if (!Array.isArray(names) || !names.length) return;
  let last = -1; try { last = +localStorage.getItem("bg"); } catch (e) {}
  let i; do { i = Math.floor(Math.random() * names.length); } while (names.length > 1 && i === last);
  try { localStorage.setItem("bg", i); } catch (e) {}
  const load = k => {
    if (k > 2 || k >= names.length) return;
    const u = FONDS + encodeURIComponent(names[(i + k) % names.length]), m = new Image();
    m.onload = () => { $("bgfx").style.backgroundImage = "url(\"" + u + "\")"; $("bgfx").classList.add("on"); };
    m.onerror = () => load(k + 1);
    m.src = u;
  };
  load(0);
}
backdrop();

const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const el = (t, props = {}, kids = []) => { const e = Object.assign(document.createElement(t), props); kids.forEach(k => e.append(k)); return e; };
const thumb = (id, q) => "https://i.ytimg.com/vi/" + id + "/" + q + ".jpg";


function ago(iso) {
  const t = new Date(iso), d = (Date.now() - t) / 36e5;
  if (isNaN(d)) return "";
  if (d < 1) return "il y a moins d'1 h";
  if (d < 24) return "il y a " + Math.floor(d) + " h";
  if (d < 48) return "hier";
  if (d < 168) return "il y a " + Math.floor(d / 24) + " j";
  return t.toLocaleDateString("fr-FR", t.getFullYear() === new Date().getFullYear() ? { day: "numeric", month: "long" } : { day: "numeric", month: "long", year: "numeric" });
}

function chip(label, count, on, fn) {
  const b = el("button", { className: "chip", type: "button" }, [label, el("small", { textContent: count })]);
  b.setAttribute("aria-pressed", on);
  b.onclick = () => { fn(); shown = PAGE; renderChips(); render(); };
  return b;
}
function renderChips() {
  const bySite = {}, byType = {};
  ALL.forEach(a => { bySite[a.source] = (bySite[a.source] || 0) + 1; byType[a.type] = (byType[a.type] || 0) + 1; });
  const mk = n => chip(n, bySite[n] || 0, site === n, () => { site = site === n ? null : n; });
  NEWS.forEach(a => { bySite[a.source] = (bySite[a.source] || 0) + 1; });
  $("chips").replaceChildren(chip("Tout", ALL.length, !type && !site, () => { type = site = null; }), ...Object.keys(SOURCES).map(mk), ...(Object.keys(NSOURCES).length ? [el("span", { className: "sep" })] : []), ...Object.keys(NSOURCES).map(mk));
}

const home = () => !type && !site && !$("q").value.trim();
// une vidéo par chaîne à tour de rôle : plus de diversité
const mix = l => { const g = {}; l.forEach(a => (g[a.source] = g[a.source] || []).push(a)); const q = Object.values(g), o = []; for (let i = 0; q.some(x => i < x.length); i++) q.forEach(x => x[i] && o.push(x[i])); return o; };
const anim = (c, d) => { if (d >= 0) { c.classList.add("pop"); c.style.setProperty("--d", Math.min(d, 6)); } return c; };
const dur = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0"); return h ? h + ":" + String(m).padStart(2, "0") + ":" + x : m + ":" + x; };
const nf = new Intl.NumberFormat("fr-FR", { notation: "compact", maximumFractionDigits: 1 });

function pic(a, i) {
  const m = el("img", { alt: "", decoding: "async", loading: i < 4 ? "eager" : "lazy", referrerPolicy: "no-referrer" });
  if (i < 2) m.fetchPriority = "high";
  let retry = true;
  m.onload = () => m.classList.add("ok");
  m.onerror = () => { if (retry) { retry = false; m.src = thumb(a.video, "mqdefault"); } else m.remove(); };
  m.src = a.image || thumb(a.video, "hq720");
  return m;
}
const sec = label => el("div", { className: "sec" }, [el("h3", { textContent: label })]);

// carte vidéo : un clic sur l'image lance la lecture dans la carte
function vc(a, i, d) {
  const fresh = Date.now() - new Date(a.date) < 48 * 36e5;
  const p = el("span", { className: "pic vpic" }, [pic(a, i), el("span", { className: "play", textContent: "▶" }), ...(fresh ? [el("span", { className: "tag", textContent: "Nouveau" })] : []), ...(a.duration ? [el("span", { className: "dur", textContent: dur(a.duration) })] : [])]);
  const meta = el("div", { className: "meta" }, [el("span", { className: "src", textContent: a.source }), el("time", { textContent: ago(a.date), dateTime: a.date }), ...(a.views ? [el("span", { className: "vw", textContent: nf.format(a.views) + " vues" })] : [])]);
  const c = anim(el("div", { className: "hc hv" }, [p, el("h2", {}, [el("a", { href: a.link, target: "_blank", rel: "noopener", textContent: a.title })]), meta]), d);
  p.tabIndex = 0; p.setAttribute("role", "button"); p.setAttribute("aria-label", "Lire la vidéo : " + a.title);
  const go = () => { p.classList.add("playing"); p.replaceChildren(el("iframe", { title: a.title, allowFullscreen: true,
    allow: "autoplay; encrypted-media; picture-in-picture", src: "https://www.youtube-nocookie.com/embed/" + a.video + "?autoplay=1&rel=0" })); };
  p.onclick = go;
  p.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  return c;
}

const when = iso => { const d = new Date(iso); return isNaN(d) ? "" : "Le " + d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); };

// carte actualité : miniature à gauche, titre, site + date
function nc(a, d) {
  const kids = [];
  if (a.image) {
    const m = el("img", { alt: "", decoding: "async", loading: "lazy", referrerPolicy: "no-referrer" });
    m.onload = () => m.classList.add("ok"); m.onerror = () => m.parentNode && m.parentNode.remove();
    m.src = a.image; kids.push(el("span", { className: "nth" }, [m]));
  }
  kids.push(el("div", { className: "ntx" }, [el("h2", { textContent: a.title }), el("div", { className: "nm" }, [el("b", { textContent: a.source }), " / " + when(a.date)])]));
  return anim(el("a", { className: "nc", href: a.link, target: "_blank", rel: "noopener" }, kids), d);
}

// Accueil : [vidéo Origami fixe (2×2) + 4 vidéos], puis en alternance 8 actus / 8 vidéos
function homeView(vids, news) {
  const hero = vids.find(a => a.source === "Origami");           // la plus récente d'Origami (liste triée par date)
  const pool = vids.filter(a => a !== hero), nw = mix(news), out = [], n = { i: 0 };
  const v = a => vc(a, n.i++, -1);
  const top = [];
  if (hero) { const b = v(hero); b.classList.add("big"); top.push(b); }
  top.push(...pool.splice(0, 4).map(v));
  out.push(sec("Les dernières vidéos"), el("div", { className: "hero top4" }, top));
  while (nw.length || pool.length) {
    if (nw.length) out.push(sec("Actualités"), el("div", { className: "news" }, nw.splice(0, 8).map(a => nc(a, -1))));
    if (pool.length) out.push(sec("Découverte & avis"), el("div", { className: "hero" }, pool.splice(0, 8).map(v)));
  }
  return out;
}

function render() {
  const q = norm($("q").value.trim()), g = $("grid"), ok = a => (!site || a.source === site) && (!q || norm(a.title + " " + a.source).includes(q));
  const vids = ALL.filter(ok), nws = NEWS.filter(ok);
  $("more").hidden = true;
  if (!vids.length && !nws.length) { g.replaceChildren(el("p", { className: "msg", textContent: ALL.length || NEWS.length ? "Rien trouvé. Essaie un mot plus court ou change de chaîne." : "Rien à regarder pour l'instant ! La prochaine mise à jour remplira la page." })); return; }
  if (home()) { g.replaceChildren(...homeView(vids, nws)); return; }
  const out = [];
  if (nws.length) out.push(sec(site || "Actualités"), el("div", { className: "news" }, nws.map(a => nc(a, -1))));
  if (vids.length) out.push(sec(site || (q ? "Vidéos" : "Les dernières vidéos")), el("div", { className: "hero" }, vids.map((a, j) => vc(a, j, -1))));
  g.replaceChildren(...out);
}

async function init() {
  try {
    const d = await (await fetch("data.json", { cache: "no-store" })).json();
    d.sources.forEach(s => SOURCES[s.name] = s);
    ALL = d.articles; NEWS = d.news || [];
    (d.news_sources || []).forEach(x => NSOURCES[x.name] = x);
    $("foot").replaceChildren(el("p", { className: "fine", textContent: "Dernier tour de mise à jour : " + new Date(d.updated).toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" }) + ". Les vidéos sont lues depuis YouTube : les vues et les droits restent aux créateurs." }));
  } catch (e) { ALL = []; }
  ALL.forEach(a => a.type = a.category || "Vidéo");
  ALL.sort((a, b) => new Date(b.date) - new Date(a.date)); // du plus récent au plus ancien
  NEWS.sort((a, b) => new Date(b.date) - new Date(a.date));
  
  renderChips(); render();
}

const ic = p => '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + "</svg>";
function applyTheme(t) {
  root.dataset.theme = t;
  $("knob").innerHTML = t === "dark" ? ic('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>') : ic('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
  $("theme").setAttribute("aria-checked", t === "dark");
}
$("theme").onclick = () => { const t = root.dataset.theme === "dark" ? "light" : "dark"; applyTheme(t); try { localStorage.setItem("theme", t); } catch (e) {} };
applyTheme(root.dataset.theme || "light");

let tm;
$("q").oninput = () => { clearTimeout(tm); tm = setTimeout(() => { shown = PAGE; render(); }, 120); };
$("sb").onclick = () => { const r = $("sr"), open = r.hidden; r.hidden = !open; $("sb").setAttribute("aria-expanded", open); if (open) $("q").focus(); else if ($("q").value) { $("q").value = ""; shown = PAGE; render(); } };
$("q").onkeydown = e => { if (e.key === "Escape") $("sb").click(); };
init();
</script>
</body>
</html>
